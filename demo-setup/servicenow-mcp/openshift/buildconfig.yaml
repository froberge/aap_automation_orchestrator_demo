apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: servicenow-mcp
  namespace: servicenow-mcp
  labels:
    app: servicenow-mcp
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: servicenow-mcp:latest
  triggers: []
